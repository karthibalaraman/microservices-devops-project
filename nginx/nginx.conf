server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"nginx"}';
    }

    # /users/api/users -> User Service /api/users
    location /users/ {
        proxy_pass http://user-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /products/api/products -> Product Service /api/products
    location /products/ {
        proxy_pass http://product-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /orders/api/orders -> Order Service /api/orders
    location /orders/ {
        proxy_pass http://order-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
