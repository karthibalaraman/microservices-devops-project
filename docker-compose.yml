services:
  user-service:
    build: ./user-service
    image: user-service:local
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_FILE: /app/data/users.json
    volumes:
      - user-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    image: product-service:local
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_FILE: /app/data/products.json
    volumes:
      - product-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  order-service:
    build: ./order-service
    image: order-service:local
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_FILE: /app/data/orders.json
    volumes:
      - order-data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

volumes:
  user-data:
  product-data:
  order-data:
